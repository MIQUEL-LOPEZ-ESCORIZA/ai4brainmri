name: ai4brainmri
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.5.1
      - torchvision==0.17.0
      - monai==1.3.0
      - einops==0.7.0  # transitive MONAI dependency (SABlock), not always pulled in automatically
      - torchmetrics==1.3.1
      - timm==0.4.12
      - scikit-learn==1.4.2
      - nibabel==5.2.0
      - pandas
      - pyyaml
      - matplotlib
      - wandb==0.16.3
      # required by pretraining/ (ported from the SEGMENTATION repo), not by downstream/
      - yacs           # src/data/config.py's config system
      - termcolor      # src/data/logger.py
      - transformers   # src/utils/lr_sched.py's HF-style cosine/polynomial schedule helpers
      - pillow         # utils_seg.py
