# Final evaluation of the ad_diagnosis_train.yaml checkpoint on the broad multi-cohort test set
# (ADNI internal test + NACC/AIBL/OASIS1-4/MIRIAD external cohorts). Reports the 3-way pairwise
# AD-diagnosis macro-AUC (AD-vs-CN, AD-vs-MCI, MCI-vs-CN) with bootstrap CIs, both overall and
# per source_dataset cohort -- matches notebooks/eval_vit_AD_results (1).ipynb.
task_name: ad_diagnosis_eval

data:
  test_csv: /path/to/data/ADNI_NACC_AIBL_OASIS1234_MIRIAD_diagnosis_test.csv
  cohort_col: source_dataset # per-cohort breakdown: ADNI, NACC, AIBL, OASIS1-4, MIRIAD
  batch_size: 64
  subject_col: subject_id # participant-level bootstrap

predictions_csv: results/predictions/ad_diagnosis_asp.csv # input to analysis/compare_models.py

model:
  pretrained: checkpoints/ad_diagnosis.pt # output of ../finetune/ad_diagnosis_train.yaml
  num_classes: 2
  adaptation: lora # must match the training config, so the LoRA adapters exist before loading
  lora_rank: 8
  lora_alpha: 16

train:
  smooth_mci_label: true # selects the pairwise AD_CN/AD_MCI/MCI_CN macro-AUC in evaluate.py
