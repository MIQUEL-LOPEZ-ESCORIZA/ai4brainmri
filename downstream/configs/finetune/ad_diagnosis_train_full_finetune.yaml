# Full fine-tuning ablation (paper Supplementary, "ASP (FF)"): every encoder parameter is updated,
# with the same optimization and augmentation settings as the LoRA config of the same task.
task_name: full_ft_ad_diagnosis_train

data:
  train_csv: /path/to/data/ADNI_train.csv
  val_csv: /path/to/data/ADNI_val.csv
  batch_size: 64

model:
  # Raw ASP-pretrained checkpoint (see pretraining/README.md) -- point this at your own.
  pretrained: /path/to/checkpoints/asp_pretrained.pth
  num_classes: 2 # binary classification head; label smoothing below turns 3 diagnoses into a soft 2-way target
  adaptation: full
  save_path: checkpoints/ad_diagnosis_full_finetune.pt

train:
  max_epochs: 150 # same optimization/augmentation settings as LoRA (paper Methods)
  val_every: 2
  base_lr: 1.5e-4
  weight_decay: 0.005
  # healthy=0, Alzheimer's=1, MCI=0.5, per paper Methods ("Linear Models with Anatomical Features")
  smooth_mci_label: true
