# LoRA adaptation (the paper's reported strategy) of the ASP-pretrained encoder for epilepsy
# (FCD II) vs. healthy controls, OpenNeuro ds004199. For the plain-MAE "Pretrained ViT", override
# model.pretrained as in ad_diagnosis_train.yaml. Scored by ../eval/epilepsy_internal.yaml and
# ../eval/epilepsy_episurg.yaml.
task_name: epilepsy_train

data:
  train_csv: /path/to/data/OpenNeuro_epilepsy_train.csv
  # Same file as train_csv, matching the original repo exactly: the training cohort (n=82) is
  # too small to hold out a separate validation split, so validation is measured on the training
  # set itself. Not best ML practice, but faithfully replicating the original rather than
  # inventing a split it never had.
  val_csv: /path/to/data/OpenNeuro_epilepsy_train.csv
  batch_size: 64

model:
  pretrained: /path/to/checkpoints/asp_pretrained.pth
  num_classes: 2
  adaptation: lora # paper default; see the *_full_finetune.yaml variant for the ablation
  lora_rank: 8      # TODO(authors): confirm the rank/alpha used for the paper runs
  lora_alpha: 16
  save_path: checkpoints/epilepsy.pt

train:
  max_epochs: 150 # paper Methods: LoRA trained for 150 epochs with AdamW
  val_every: 2
  base_lr: 1.5e-4
  weight_decay: 0.005
  smooth_mci_label: false
