# Partial fine-tuning (only the last transformer block + head) on OpenNeuro epilepsy data --
# the training cohort is small (n=82), so full fine-tuning overfits. Matches paper Methods:
# "partial finetuning, updating only the final attention block." Produces the checkpoint that
# ../eval/epilepsy_internal.yaml and ../eval/epilepsy_episurg.yaml score.
task_name: epilepsy_train

data:
  train_csv: /path/to/data/OpenNeuro_epilepsy_train.csv
  # Same file as train_csv, matching the original repo exactly: the training cohort (n=82) is
  # too small to hold out a separate validation split, so validation is measured on the training
  # set itself. Not best ML practice, but faithfully replicating the original rather than
  # inventing a split it never had.
  val_csv: /path/to/data/OpenNeuro_epilepsy_train.csv
  batch_size: 64

model:
  pretrained: /path/to/checkpoints/asp_pretrained.pth
  num_classes: 2
  lock_last_block_only: true
  save_path: checkpoints/epilepsy.pt

train:
  max_epochs: 10 # short schedule: small dataset, partial fine-tuning converges fast
  val_every: 1
  base_lr: 1.5e-4
  weight_decay: 0.005
  smooth_mci_label: false
