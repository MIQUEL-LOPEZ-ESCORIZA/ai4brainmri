# LoRA adaptation (the paper's reported strategy) of the ASP-pretrained encoder for brain age
# (chronological-age regression) on healthy UKBB + HCP + CamCAN + IXI participants. The UKBB
# holdout (10% of UKBB participants) is excluded from training. For the plain-MAE "Pretrained
# ViT", override model.pretrained. Scored by ../eval/healthy_aging.yaml (internal) and
# ../eval/healthy_aging_external.yaml (external).
task_name: healthy_aging_train

data:
  train_csv: /path/to/data/healthy_aging_train.csv
  val_csv: /path/to/data/healthy_aging_val.csv
  batch_size: 64

model:
  pretrained: /path/to/checkpoints/asp_pretrained.pth
  num_classes: 1 # regression head
  adaptation: lora # paper default; see the *_full_finetune.yaml variant for the ablation
  lora_rank: 8      # TODO(authors): confirm the rank/alpha used for the paper runs
  lora_alpha: 16
  save_path: checkpoints/healthy_aging.pt

train:
  max_epochs: 150 # paper Methods: LoRA trained for 150 epochs with AdamW
  val_every: 2
  base_lr: 1.5e-4
  weight_decay: 0.005
  smooth_mci_label: false
