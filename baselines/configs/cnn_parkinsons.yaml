# ResNet-18 baseline, Parkinson's disease (PPMI).
task: classification
arch: resnet18
roi: [128, 128, 128]
batch_size: 16
max_epochs: 60
lr: 0.01                       # SGD
momentum: 0.0                  # not stated in the paper; plain SGD
early_stopping_patience: 10    # on validation loss
train_csv: /path/to/data/PPMI_train.csv
val_csv: /path/to/data/PPMI_val.csv
test_csv: /path/to/data/PPMI_test.csv
img_path_col: img_path_T1_mni152
label_col: pd_label
subject_col: subject_id
cohort_col: ""
save_path: checkpoints/cnn_parkinsons.pt
predictions_csv: results/predictions/parkinsons_cnn.csv
